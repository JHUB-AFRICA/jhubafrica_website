services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_API_URL: ${VITE_APP_API_URL}
    container_name: jhub-website
    ports:
      - "${PORT:-4173}:4173"
    environment:
      - NODE_ENV=production
      - PORT=4173
    volumes:
      - jhub-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4173/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - jhub-network
    profiles:
      - frontend
      - all

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jhub-backend
    ports:
      - "4001:4000"
    dns:
      - 8.8.8.8
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped
    networks:
      - jhub-network
    profiles:
      - backend
      - all

volumes:
  jhub-data:
    name: jhub-data

networks:
  jhub-network:
    name: jhub-network
    driver: bridge
